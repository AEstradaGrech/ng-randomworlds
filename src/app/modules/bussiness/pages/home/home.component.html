  :root {
    --night: #0b0a0f;
    --panel: #12111a;
    --surface: #1a1824;
    --line: rgb(255 255 255 / .08);
    --line-2: rgb(255 255 255 / .14);
    --fg: #efeae0;
    --soft: #b8b2a5;
    --muted: #7c776c;
    --ember: #f0883e;
    --teal: #7fc8b4;
    --danger: #e5564b;
    --f-display: "Gloock", Georgia, serif;
    --f-body: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    --f-label: "Geist Mono", ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);
    color-scheme: dark;
  }

  body {
    background: var(--night);
    color: var(--fg);
    font: 16px/1.6 var(--f-body);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 48px 88px;
  }

  .label {
    font: 500 10.5px/1.4 var(--f-label);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ember);
  }
