<form [formGroup]="form">
    <div class="card-container shadow">
        <div class="form-controls">
            <button class="reset-btn" (click)="onReset()">
                <mat-icon style="margin-top: 6px; font-size: 20px !important; color: #161616;"
                aria-hidden="false" 
                aria-label="Example power icon"
                font-size="20px" 
                fontIcon="replay"
                ></mat-icon>
             </button>
            <mat-form-field class="form-inputs" >
                <mat-label>Description</mat-label>
                <input matInput type="text" formControlName="description"/>
            </mat-form-field>
            <mat-form-field class="form-inputs" >
                <mat-label>Tag</mat-label>
                <input matInput type="text" formControlName="tag"/>
            </mat-form-field>
            <button class="search-btn" (click)="onSearch()">
                <mat-icon style="margin-top: 6px; font-size: 20px !important; color: #bbbbbb;"
                aria-hidden="false" 
                aria-label="Example power icon"
                font-size="20px" 
                fontIcon="search"
                ></mat-icon>
             </button>
             <button class="add-btn" (click)="onAdd()">
                <mat-icon style="margin-top: 6px; font-size: 20px !important; color: #bbbbbb;"
                aria-hidden="false" 
                aria-label="Example power icon"
                font-size="20px" 
                fontIcon="add"
                ></mat-icon>
             </button>
        </div>
        <div class="msgs-table">
            <table mat-table [dataSource]="currentData" matSort (matSortChange)="onSortChange($event)"class="mat-elevation-z8">

                <!-- Position Column -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by desc">
                    Description
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                </ng-container>
    
                <!-- Name Column -->
                <ng-container matColumnDef="tag">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by tag">
                    Tag
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.tag}} </td>
                </ng-container>
    
                <!-- Weight Column -->
                <ng-container matColumnDef="message">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by message">
                    Message
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.message}} </td>
                </ng-container>
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef style="width: 6%;">
                    Actions
                    </th>
                    <td mat-cell *matCellDef="let element" style="display: contents;"> 
                        <button class="details-btn" (click)="onDetailsClick(element)" style="margin: 7px 4px 0px 2px;">
                            <mat-icon style="margin-top: 6px; font-size: 20px !important;"
                            aria-hidden="false" 
                            aria-label="Example power icon"
                            font-size="20px" 
                            fontIcon="visibility"
                            ></mat-icon>
                         </button>
                         <button class="delete-btn" (click)="onDelete(element)" style="margin: 7px 0px 0px 2px;">
                            <mat-icon style="margin-top: 6px; font-size: 20px !important;"
                            aria-hidden="false" 
                            aria-label="Example add icon"
                            font-size="20px" 
                            fontIcon="cancel"
                            ></mat-icon>
                         </button>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                
                </table>
                <mat-paginator [length]="totalRecords" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]" (page)="onPaginationChange($event)"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
                </mat-paginator>
        </div>
    </div>
</form>
