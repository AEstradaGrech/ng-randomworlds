<div style="margin: 1px 1px 1px 1px; background-color: #2b0c29; border-radius: 7px;">
    <h3 class="jc-center" style="display: flex; color: antiquewhite; margin: 10px 0px 0px 0px;" mat-dialog-title>System message details</h3>
    
    <div style="display: block; margin: 0px 30px 0px 228px; ">
        <mat-form-field class="modal-control">
            <mat-label>Message Type</mat-label>
            <mat-select [(ngModel)]="selectedType" name="Message type" [disabled]="!isEditing && data.isEdit">
                @for (msg of msgTypes; track msg) {
                <mat-option [value]="msg.type">{{msg.description}}</mat-option>
                }
            </mat-select>
        </mat-form-field>
        <mat-form-field class="modal-control">
            <mat-label>Tag</mat-label>
            <input #tagInput type="text" matInput  [(ngModel)]="messageTag" [disabled]="!isEditing && data.isEdit">
        </mat-form-field>
        <mat-slide-toggle *ngIf="data.isEdit" class="modal-control" [checked]="isEditing" (change)="onEditMessageToggle($event)">Edit Message</mat-slide-toggle>    
    </div>
    
    <textarea #descriptionbox [disabled]="!isEditing && data.isEdit" rows="15" cols="100" class="text-area" placeholder="...">{{currentMsg}}</textarea>
    <mat-dialog-actions align="center">
    <button  mat-button mat-dialog-close>Close</button>
    <button class="modal-btn" 
            mat-button 
            (click)="submit()" 
            [ngClass]="{'disabled-btn': !isEditing && data.isEdit}"
            [disabled]="!isEditing && data.isEdit" >{{btnText}}
    </button>
    </mat-dialog-actions>    
</div>
