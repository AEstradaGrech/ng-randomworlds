<form [formGroup]="form">
    <div class="card-container shadow">
        <div class="form-controls">
            <mat-form-field class="form-inputs" >
                <mat-label>Username</mat-label>
                <input matInput type="text" formControlName="username"/>
            </mat-form-field>
            <mat-form-field class="form-inputs" >
                <mat-label>Tag</mat-label>
                <input matInput type="text" formControlName="tag"/>
            </mat-form-field>
            <button class="search-btn" (click)="onSearch()">
                <mat-icon style="margin-top: 6px; font-size: 20px !important; color: #bbbbbb;"
                aria-hidden="false" 
                aria-label="Example power icon"
                font-size="20px" 
                fontIcon="search"
                ></mat-icon>
             </button>
             <button class="reset-btn" (click)="onReset()">
                <mat-icon style="margin-top: 6px; font-size: 20px !important; color: #161616;"
                aria-hidden="false" 
                aria-label="Example power icon"
                font-size="20px" 
                fontIcon="replay"
                ></mat-icon>
             </button>
        </div>
        <div class="msgs-table">
            <table mat-table
                [dataSource]="data" multiTemplateDataRows
                class="mat-elevation-z8">
            @for (column of columnsToDisplay; track column) {
                <ng-container *ngIf="column !== 'actions'" matColumnDef="{{column}}" style="justify-content: center !important;">
                    <th mat-header-cell *matHeaderCellDef> {{column}} </th>
                    <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
                </ng-container>
                <ng-container *ngIf="column === 'actions'" matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef style="width: 6%;">
                    Actions
                    </th>
                    <td mat-cell *matCellDef="let element" style="display: contents;"> 
                        <button class="details-btn" (click)="onDetailsClick(element)" style="margin: 7px 4px 0px 2px;">
                            <mat-icon style="margin-top: 6px; font-size: 20px !important;"
                            aria-hidden="false" 
                            aria-label="Example power icon"
                            font-size="20px" 
                            fontIcon="visibility"
                            ></mat-icon>
                        </button>
                        <button class="delete-btn" (click)="onDelete(element)" style="margin: 7px 0px 0px 2px;">
                            <mat-icon style="margin-top: 6px; font-size: 20px !important;"
                            aria-hidden="false" 
                            aria-label="Example power icon"
                            font-size="20px" 
                            fontIcon="cancel"
                            ></mat-icon>
                        </button>
                    </td>
                </ng-container>
            }
            <ng-container matColumnDef="expand">
                <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
                <td mat-cell *matCellDef="let element">
                <button mat-icon-button aria-label="expand row" (click)="(expandedElement = expandedElement === element ? null : element); $event.stopPropagation()">
                    @if (expandedElement === element) {
                    <mat-icon>keyboard_arrow_up</mat-icon>
                    }@else {
                    <mat-icon>keyboard_arrow_down</mat-icon>
                    }
                </button>
                </td>
            </ng-container>

            <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
            <ng-container matColumnDef="expandedDetail">
                <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
                <div class="example-element-detail"
                    [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
                    <div class="summary-title">
                       Current Summary
                    </div>
                    <div *ngIf="element.summary && element.summary !== ''" class="summary-description">
                    {{element.summary}}
                    </div>
                    <div *ngIf="!element.summary || element.summary === ''" class="summary-description">
                        ...
                    </div>
                </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
            <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithExpand;"
                class="example-element-row"
                [class.example-expanded-row]="expandedElement === element"
                (click)="expandedElement = expandedElement === element ? null : element">
            </tr>
            <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
            </table>
            <mat-paginator 
                [length]="totalRecords"
                [pageSize]="pageSize" 
                [pageSizeOptions]="[5, 10]" 
                (page)="onPaginationChange($event)"
                showFirstLastButtons
                aria-label="Select page of periodic elements">
            </mat-paginator>
        </div>
    </div>
</form>
