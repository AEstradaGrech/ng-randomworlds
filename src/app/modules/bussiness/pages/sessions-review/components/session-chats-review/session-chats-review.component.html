<div style="margin: 1px 1px 1px 1px; background-color: #2b0c29; border-radius: 7px;">
    <h3 class="jc-center" style="display: flex; color: antiquewhite; margin-top: 3px;" mat-dialog-title>Review Session Chats</h3>
    <!-- <div class="jc-center" style="display: block;padding: 0px 180px 0px 180px; margin: 0px 10px 0px 10px;">
        
    </div> -->
    <mat-accordion multi>
        <mat-expansion-panel [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-description>
                    {{data.tag}} / Session ID: {{sessionId}}             
                </mat-panel-description>
            </mat-expansion-panel-header>
            <mat-paginator
                [length]="totalRecords"
                [pageSize]="1" 
                [pageSizeOptions]="[5, 10]" 
                [hidePageSize]="true"
                (page)="onPaginationChange($event)"
                showFirstLastButtons
                aria-label="Select session chat">
            </mat-paginator>
        </mat-expansion-panel>
    </mat-accordion>
    <div class="w-100 h-100 shadow">
        <app-header-navbar #navTabs class="shadow" [config]="headBarConfig" [height]="'85px'" [withLogo]="false" (onTabClicked)="onMenuTabClick($event)"></app-header-navbar>
        <mat-divider vertical="false"></mat-divider>
    </div>
    <div *ngIf="currentTab === 'System message'">
        <textarea #sysmsgbox readonly rows="26" cols="130" class="text-area" placeholder="...">{{systemMessage}}</textarea>
      </div>
      <div *ngIf="currentTab === 'Chat'">
        <textarea #chatbox readonly rows="26" cols="130" class="text-area" placeholder="...">{{currentChatText}}</textarea>
      </div>
      <div *ngIf="currentTab === 'Summary'">
        <textarea #summarybox readonly rows="26" cols="130" class="text-area" placeholder="...">{{currentChatSummary}}</textarea>
      </div>
    <mat-dialog-actions align="center">
    <button  mat-button mat-dialog-close>Close</button>
    <button class="modal-btn" 
            mat-button 
            (click)="submit()" 
            [ngClass]="{'disabled-btn': !canSetAsCurrentChat }"
            [disabled]="!canSetAsCurrentChat" >Set Current
    </button>
    </mat-dialog-actions>    
</div>
