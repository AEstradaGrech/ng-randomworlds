<app-shell [visualization]="visualization()">
  <ng-container class="upper-buttons-l">
    <app-rounded-button
        matTooltip="Change screen visualization"
        [matTooltipPosition]="'after'"
        [id]="'view-type'"
        [iconName]="'select_all'"
        [hoverColor]="'var(--primary-btn-hover)'"
        [borderColor]="'var(--primary-btn-border)'"
        [disabled]="loading"
        (onClickEvent)="switchVisualization()">
    </app-rounded-button>
  </ng-container>
  <ng-container class="shell-content">
    @for(model of modelsCatalogue; track model){
      <app-nft-card 
        [model]="model" 
        [cardButtons]="nftCardButtonsConfig"
        [disabled]="loading"
        (onCardButtonClick)="onCardButtonClicked($event)"
        >
        <ng-container class="projected-buttons">
          <app-rounded-button [matMenuTriggerFor]="colMenu"
            [id]="'col_view'"
            [iconName]="'assignment'"
            [hoverColor]="'var(--primary-btn-hover)'"
            [borderColor]="'var(--primary-btn-border)'"
            [disabled]="loading">
            </app-rounded-button>
              <mat-menu #colMenu="matMenu" yPosition="above" xPosition="after">
                <mat-card class="collection-card" appearance="outlined">
                    <mat-card-header class=" flex jc-center collection-card-header">
                      <mat-card-title class="collection-card-title">{{model.collectionName}} ({{model.collectionSymbol}})</mat-card-title>
                      <mat-card-subtitle class="collection-card-subtitle">{{model.contractAddress}}</mat-card-subtitle>
                    </mat-card-header>
                    <img mat-card-image class="collection-menu-img" [src]="replacedEndpoint(model.collectionUrl, 'IPFS', 'ALCHEMY')" alt="Collection logo">
                    <mat-card-content class="collection-card-content">
                      <p>
                        {{model.collectionDescription}}
                      </p>
                    </mat-card-content>
                  </mat-card>
              </mat-menu>
                <app-rounded-button [matMenuTriggerFor]="buyMenu" 
                    [id]="'buy'"
                    [iconName]="'payment'"
                    [hoverColor]="'var(--payment)'"
                    [borderColor]="'var(--payment-border)'"
                    [disabled]="loading"
                    [withSpinner]="loading"
                    >
                </app-rounded-button>
                <mat-menu #buyMenu="matMenu" yPosition="above" xPosition="after">
                  <app-token-selector-matmenu 
                  [buttonText]="'BUY'"
                  [title]="'Pay with ETH'"
                  [withDefaultEth]="true"
                  [textColor]="'var(--teal)'"
                  [selectorColor]="'var(--fuchsia)'"
                  [selectorHoverColor]="'var(--teal)'"
                  [buttonTextColor]="'var(--payment)'"
                  [buttonBorderColor]="'var(--payment-border)'"
                  (onTokenSelected)="onPayClick(model)"
                  >
                  </app-token-selector-matmenu>
                </mat-menu>
          </ng-container>
      </app-nft-card>
    }
  </ng-container>
</app-shell>
