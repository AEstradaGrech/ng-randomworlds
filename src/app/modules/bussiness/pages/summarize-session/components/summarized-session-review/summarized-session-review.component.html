<div style="margin: 1px 1px 1px 1px; background-color: #2b0c29; border-radius: 7px;">
    <h3 class="jc-center" style="display: flex; color: antiquewhite; margin-top: 3px;" mat-dialog-title>Search Session</h3>
    <mat-dialog-content class="jc-center" style="display: flex; color: antiquewhite;">Load session by tag</mat-dialog-content>
    <div class="jc-center" style="display: block;padding: 0px 180px 0px 180px; margin: 0px 10px 0px 10px;">
        <app-search-input [config]="searchConfig" (onValueSelected)="onSessionSelected($event)"></app-search-input>
    </div>
    <div class="w-100 h-100 shadow">
        <app-header-navbar #navTabs class="shadow" [config]="headBarConfig" [height]="'85px'" [withLogo]="false" (onTabClicked)="onMenuTabClick($event)"></app-header-navbar>
        <mat-divider vertical="false"></mat-divider>
    </div>
    <textarea readonly *ngIf="currentTab === 'Chat'" rows="28" cols="100" class="text-area" placeholder="Current chat history...">{{chatText}}</textarea>
    <textarea readonly *ngIf="currentTab === 'Summary'" rows="28" cols="100" class="text-area" placeholder="Current chat summary...">{{summaryText}}</textarea>
    <mat-dialog-actions align="center">
    <button  mat-button mat-dialog-close>Cancel</button>
    <button class="modal-btn" mat-button [mat-dialog-close]="getSelectedSession()" >Select</button>
    </mat-dialog-actions>    
</div>
