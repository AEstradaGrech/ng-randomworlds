<div style="margin: 1px 1px 1px 1px; background-color: #2b0c29; border-radius: 7px;">
    <h3 class="jc-center" style="display: flex; color: antiquewhite; margin-top: 3px;" mat-dialog-title>Save Summary</h3>
    <mat-dialog-content class="jc-center" style="display: flex; color: antiquewhite;">Add observations / comments</mat-dialog-content>
    <div class="jc-center" style="display: block;padding: 0px 180px 0px 180px; margin: 0px 10px 0px 10px;">
        <mat-form-field>
            <mat-label>Observation</mat-label>
            <input matInput #commentInput type="text" placeholder="..."/>
        </mat-form-field>
        <button class="add-btn" (click)="onAdd()">
            <mat-icon style="margin-top: 6px; font-size: 20px !important; color: #bbbbbb;"
            aria-hidden="false" 
            aria-label="Example add icon"
            font-size="20px" 
            fontIcon="add"
            ></mat-icon>
         </button>
    </div>
    <div class="msgs-table">
        <table mat-table [dataSource]="comments" class="mat-elevation-z8">
            <ng-container matColumnDef="observations">
                <th mat-header-cell *matHeaderCellDef>
                Observation
                </th>
                <td mat-cell *matCellDef="let element"> {{element}} </td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef style="width: 6%;">
                Actions
                </th>
                <td mat-cell *matCellDef="let element" style="display: flex; justify-content: center !important;"> 
                     <button class="delete-btn" (click)="onDelete(element)" style="margin: 9px 0px 0px 0px;">
                        <mat-icon style="margin-top: 6px; font-size: 20px !important;"
                        aria-hidden="false" 
                        aria-label="Delete icon"
                        font-size="20px" 
                        fontIcon="cancel"
                        ></mat-icon>
                     </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
            
    </div>
    <mat-dialog-actions align="center">
    <button  mat-button mat-dialog-close>Cancel</button>
    <button class="modal-btn" mat-button (click)="onSave()">Save</button>
    </mat-dialog-actions>    
</div>
