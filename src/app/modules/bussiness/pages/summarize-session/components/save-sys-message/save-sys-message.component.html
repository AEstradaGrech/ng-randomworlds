<div style="margin: 1px 1px 1px 1px; background-color: #2b0c29; border-radius: 7px;">
    <h2 class="jc-center" style="display: flex; color: antiquewhite; margin-top: 3px;" mat-dialog-title>Save Template</h2>
    <mat-dialog-content class="mat-typography">
        <div style="display: flex; justify-content: center;">
            <p style="color: antiquewhite;">Please, chose a Tag for the template.</p>
        </div>
        <div class="form-inputs">
            <div class="input-group">
                <mat-form-field>
                    <mat-label style="margin-left: 10px;">Tag:</mat-label>
                    <input class="form-input" matInput type="text" placeholder="..." [(ngModel)]="templateName"/>
                </mat-form-field>
            </div>
        </div>
        <textarea readonly rows="28" cols="130" class="text-area">{{data.systemMessage}}</textarea> 
    </mat-dialog-content>
    <mat-dialog-actions align="center">
      <button mat-button mat-dialog-close>Cancel</button>
      <button mat-button [disabled]="templateName === ''" (click)="onClose()" >Save</button>
    </mat-dialog-actions>
</div>
