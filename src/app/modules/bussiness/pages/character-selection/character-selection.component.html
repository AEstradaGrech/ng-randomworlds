<app-nft-visor 
    [assets]=assets() 
    [nftCardButtonsConfig]="nftCardButtonsConfig"
    [disabled]="loading()" 
    [onDisableUnfocused]="onDisableUnfocused" 
    [onCardBtnChange]="onCardBtnChange"
    (onCardButtonClick)="onCardButtonClicked($event)"
    [projectedButtonsTemplate]="[unlockBtn]">
    <ng-template #unlockBtn let-model="model">
        @if(model.isLocked){
            <app-locked-char-button
                [model]="model"
                [disabled]="loading()"
                [loading]="abandoning() === model"
                (onAbandonClick)="onUnlockAssetClick($event)"
                (onContinueClick)="onSelectClick($event)"
                (onCountdownFinish)="onCharacterUnlocked($event)">
            </app-locked-char-button>
        }
    </ng-template>
</app-nft-visor>
