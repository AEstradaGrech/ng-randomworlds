<div class="card-container">
    <div class="img-container shadow">
        <div class="background-img"></div>
        <mat-card class="game-card" appearance="outlined">
            <mat-card-header>
              <div mat-card-avatar class="game-card-header-image"></div>
              <mat-card-title class="game-card-title">World Generator </mat-card-title>
              <mat-card-subtitle class="game-card-subtitle">Generate a universe for your {{gameType}}</mat-card-subtitle>
            </mat-card-header>
            <mat-accordion multi="false">
                <mat-expansion-panel>
                  <mat-expansion-panel-header>
                    <mat-panel-title>
                        Bayaz, el Primero de los Magos
                    </mat-panel-title>
                    <mat-panel-description style="justify-content: center;">
                      Story setup
                    </mat-panel-description>
                  </mat-expansion-panel-header>
                    <form [formGroup]="form">
                        <mat-form-field class="form-control">
                            <mat-label>Ambience</mat-label>
                            <input matInput type="text" readonly formControlName="ambience"/>
                        </mat-form-field>
                        <mat-form-field>
                            <mat-label>Genres</mat-label>
                            <input matInput type="text" [disabled]="true" formControlName="genres"/>
                        </mat-form-field>
                    </form>
                    <mat-expansion-panel>
                        <mat-expansion-panel-header style="height: 35px;">
                          <mat-panel-description style="justify-content: center;">
                            Plot suggestion
                          </mat-panel-description>
                        </mat-expansion-panel-header>       
                            <mat-form-field class="form-control" style="width: 100%;">
                                <mat-label>Plot</mat-label>
                                <input matInput type="text" formControlName="plot" max="20"/>
                            </mat-form-field>
                      </mat-expansion-panel>
                </mat-expansion-panel>
              </mat-accordion>  
            <mat-card-content class="game-card-content">
                <div class="text-container">
                    <textarea class="text-area"></textarea>
                </div>
            </mat-card-content>
            <mat-card-actions class="game-card-actions">
              <button mat-stroked-button class="begin-btn" (click)="onGenerateClick()">GENERATE</button>
            </mat-card-actions>
          </mat-card>
    </div>
</div>
