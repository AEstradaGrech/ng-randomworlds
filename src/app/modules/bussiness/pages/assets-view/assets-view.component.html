  <div class="sidenav-div">
    <mat-sidenav-container class="sidenav-container" (backdropClick)="closeSidenav()">
        <mat-sidenav #sidenav (keydown.escape)="closeSidenav()" disableClose class="sidenav">
                <div style="display: flex; align-items: center; justify-content:center; margin:15px 25px 15px 0px">
                    <button class="close-sidenav-btn" (click)="closeSidenav()">
                        <mat-icon style="margin-top: 6px; font-size: 20px !important;"
                            aria-hidden="false" 
                            aria-label="Collections sidenav view"
                            fontIcon="keyboard_arrow_left"></mat-icon>
                    </button>
                </div>
                <mat-accordion class="collections-accordion">
                    @if(customCharsCollection) {
                        <ng-container *ngTemplateOutlet="collectionsInfo; context:{
                            expanded: selectedContractAddress() === customCharsCollection.contractAddress,
                            name: customCharsCollection.name,
                            token: null,
                            symbol: customCharsCollection.symbol,
                            address: customCharsCollection.contractAddress,
                            description: 'Collection of minted custom characters',
                            total: -1,
                            image: defaultLogoUrl,
                            item: customCharsCollection,
                            open: selectCustomCharsCollection
                          }">
                        </ng-container>
                    }
                    @for(collection of collections; track collection){
                        <ng-container *ngTemplateOutlet="collectionsInfo; context:{
                        expanded: selectedContractAddress() === collection.summary.address,
                        name: collection.summary.name,
                        token: collection.summary.tokenName,
                        symbol: collection.summary.symbol,
                        address: collection.summary.address,
                        description: collection.summary.description,
                        total: collection.assets.length,
                        image: imageWithEndpointReplace(collection.summary.logoImage, 'IPFS', 'ALCHEMY'),
                        item: collection,
                        open: selectCollection
                        }">
                        </ng-container>
                    }
                  </mat-accordion>
        </mat-sidenav>
        <mat-sidenav-content>
            <app-nft-visor
                [assets]=displayedAssets()
                [nftCardButtonsConfig]="nftCardButtonsConfig"
                [disabled]="loading()"
                [onDisableUnfocused]="onDisableUnfocused" 
                [onCardBtnChange]="onCardBtnChange"
                (onCardButtonClick)="onCardButtonClicked($event)"
                (onVisualizationChange)="onVisorTypeChange($event)"
                [projectedButtonsTemplate]="[sellButton, lockButton]">
                <ng-template #sellButton let-model="model">  
                    <app-rounded-button [matMenuTriggerFor]="(model.isInGame ? null :sellMenu)" 
                        [id]="'sell'"
                        [iconName]="'payment'"
                        [hoverColor]="'var(--payment)'"
                        [borderColor]="'var(--payment-border)'"
                        [disabled]="loading() || model.isInGame"
                        >
                    </app-rounded-button>
                    <mat-menu #sellMenu="matMenu" yPosition="above" xPosition="after">
                        <mat-card class="menu-card" appearance="outlined">
                            <mat-card-header class="pay-menu-header">
                                <mat-card-title class="collection-card-title">{{model.collection}}</mat-card-title>
                                <mat-card-subtitle class="collection-card-subtitle">{{model.contractAddress}}</mat-card-subtitle>
                            </mat-card-header>
                            <mat-card-content class="payment-card-content"></mat-card-content>
                            <mat-card-actions class="flex jc-center">
                                 <app-squared-button  class="lock-menu-btn"
                                        [text]="'SELL'",
                                        [config]="squaredPayButtonConfig"
                                        (onClick)="onSellClick(model)">
                                    </app-squared-button>
                            </mat-card-actions>
                        </mat-card>
                    </mat-menu>
                </ng-template>
                <ng-template #lockButton let-model="model"> 
                    @if(model.isLocked){
                        <app-locked-char-button
                            [model]="model"
                            [disabled]="loading()"
                            [loading]="abandoning() === model"
                            (onAbandonClick)="onUnlockAssetClick($event)"
                            (onContinueClick)="onCardSelected($event)">
                        </app-locked-char-button>
                    }
                </ng-template>
                <ng-container class="upper-buttons-l">
                    <div style="display: grid">
                        <app-rounded-button 
                            matTooltip="View collections"
                            [matTooltipPosition]="'after'"
                            [id]="'view-cols'"
                            [iconName]="'skip_next'"
                            [hoverColor]="'var(--primary-btn-hover)'"
                            [borderColor]="'var(--primary-btn-border)'"
                            [disabled]="loading()"
                            (onClickEvent)="sidenav.open()">
                        </app-rounded-button>
                        <app-rounded-button 
                            matTooltip="Generate character"
                            [matTooltipPosition]="'after'"
                            [id]="'generate-char'"
                            [iconName]="'android'"
                            [hoverColor]="'var(--fuchsia)'"
                            [borderColor]="'var(--fuchsia)'"
                            [disabled]="loading()"
                            (onClickEvent)="onCreateCharacterClick()">
                        </app-rounded-button>
                    </div>
                </ng-container>
            </app-nft-visor>
        </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
  <ng-template #collectionsInfo let-expanded="expanded" let-name="name" let-symbol="symbol" let-token="token" let-address="address" let-description="description" let-total="total" let-image="image" let-item="item" let-open="open">
    <mat-expansion-panel class="collection-panel"  [expanded]="expanded" (opened)="open(item)" hideToggle>
        <mat-expansion-panel-header [collapsedHeight]="'10%'" [expandedHeight]="'10%'" style="padding: 0px 0px 0px 0px !important">
            <div style="display: block; width: 80%; margin: 15px 10px 5px 15px">
                <mat-panel-title class="col-title"> {{name}} </mat-panel-title>
                <mat-panel-description class="col-subtitle">
                    <p *ngIf="token !== null" style="margin: 0 0 5px !important;">{{symbol}} - {{token}}</p>
                    <p style="margin: 0 0 5px !important;">{{symbol}}</p>
                    <p style="margin: 0 0 5px !important;">{{address}}</p>
                    <p *ngIf="total > 0" style="margin: 0 0 5px !important;">Total assets: {{total}}</p>
                </mat-panel-description>
            </div>
            <img style="width: 25%; margin: 5px 5px 5px 5px; padding-top: 5px; padding-bottom: 5px; border-radius: 15px !important;" [src]="image" alt="Collection logo">
        </mat-expansion-panel-header>
        <div style="display: flex;">
            <div style="padding-top: 15px; width: 75%;">
                <p><span class="collection-card-ethscan-txt">{{description}}</span></p>
            </div>
            <div class="col-sel-div">
                <app-rounded-button 
                    style="margin-left:9px"
                    [id]="'view_collection'"
                    [iconName]="'content_paste'"
                    [size]="'35px'"
                    [hoverColor]="'var(--primary-btn-hover)'"
                    [borderColor]="'var(--primary-btn-border)'"
                    (click)="onViewCollectionClick(address)">
                </app-rounded-button>
            </div>
        </div>
        </mat-expansion-panel>
  </ng-template>
