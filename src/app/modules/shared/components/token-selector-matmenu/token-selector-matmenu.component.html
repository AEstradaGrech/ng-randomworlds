<mat-card style="margin: 0px 5px" appearance="outlined">
    <mat-card-header style="display: flex; justify-content: center; align-items: start; padding: 5px 0px 0;">
        <mat-card-title class="collection-card-title" [style.--text-color]="textColor">{{title}}</mat-card-title>
        <mat-card-subtitle class="collection-card-subtitle" [style.--text-color]="textColor">{{subtitle}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="payment-card-content">
        <label style="font-weight: 400;">{{label}}</label>
        <mat-radio-group class="tokens-radio-group" [(ngModel)]="selectedToken" (click)="$event.stopPropagation()">
        @for(paymentToken of paymentTokens; track paymentToken){
            <mat-radio-button class="token-selector" 
                [value]="paymentToken" 
                (change)="onTokenChange($event)"
                [style.--selector-color]="selectorColor"
                [style.--selector-hover-color]="selectorHoverColor"
                >
                {{paymentToken}}
            </mat-radio-button>
        }
        </mat-radio-group>
    </mat-card-content>
    <mat-card-actions style="display: flex; justify-content: center;">
        <button mat-stroked-button 
            class="pay-btn" 
            [disabled]="!selectedToken || selectedToken === ''" 
            (click)="onSelectTokenClick()"
            [style.--btn-text-color]="buttonTextColor"
            [style.--btn-border-color]="buttonBorderColor">
            {{buttonText}}
        </button>
    </mat-card-actions>
</mat-card>
