<app-rounded-button 
    [matMenuTriggerFor]="unlockMenu"
    [id]="'unlock'"
    [iconName]="'lock'"
    [hoverColor]="'var(--danger)'"
    [borderColor]="'var(--danger)'"
    [disabled]="disabled() ?? false"
    [withSpinner]="loading() ?? false">
</app-rounded-button>
<mat-menu #unlockMenu="matMenu" yPosition="above" xPosition="after">
    <mat-card class="menu-card" appearance="outlined">
        <mat-card-header class="locked-menu-header">
            <mat-card-title class="collection-card-title">{{model().collection}}</mat-card-title>
            <mat-card-subtitle class="collection-card-subtitle">{{model().contractAddress}}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="lockedchar-card-content">
            @if(model().isInGame){
                <h5>Character is currently in game</h5>
            }
            @else{
                <h5>Character is recovering. Locked until {{model().lockedUntil}}</h5>
            }
        </mat-card-content>
        <mat-card-actions class="locked-char-action">
            <app-squared-button class="lock-menu-btn"
                [text]="model().isInGame ? 'ABANDON' : 'UNLOCK'",
                [danger]="true"
                [config]="squaredButtonConfig"
                (onClick)="onAbandonClicked()">
            </app-squared-button>
            <app-squared-button *ngIf="model().isInGame" class="lock-menu-btn"
                [text]="'CONTINUE'",
                [outline]="true"
                [config]="squaredButtonConfig"
                (onClick)="onContinueClicked()">
            </app-squared-button>
        </mat-card-actions>
    </mat-card>
</mat-menu>
