<div class="h-100 flex column" [ngStyle]="{ 'width': width }">
    <div *ngIf="withLogo" class="logo">
        <app-logo [titleColor]="colorsConfig.titleColor" [subtitleColor]="colorsConfig.subtitleColor"></app-logo>
    </div>
    @if(colorsConfig){
        <app-tree-menu #treemenu class="tree-menu" 
        [items]="config" 
        [itemTextColor]="colorsConfig.itemText"
        [itemBgColor]="colorsConfig.itemBg"
        [itemTextHover]="colorsConfig.itemTextHover"
        [itemBgColorHover]="colorsConfig.itemBgHover"
        [selectedColor]="colorsConfig.selected"
        [selectedBgColor]="colorsConfig.selectedBg"
        [openColor]="colorsConfig.open"
        [openBgColor]="colorsConfig.openBg"
        (onSelect)="onMenuSelect($event)"></app-tree-menu>
    }
    @else{
        <app-tree-menu #treemenu class="tree-menu" [items]="config" (onSelect)="onMenuSelect($event)"></app-tree-menu>
    }
</div>
