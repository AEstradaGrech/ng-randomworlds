
<button class="rounded-btn" 
    (click)="onClick()"
    (mousedown)="onMousedown()",
    (mouseup)="onMouseup()", 
    [style.padding]="'0px'"
    [style.--btn-margin]="margin" 
    [style.--btn-size]="size"
    [style.--btn-color]="backgroundColor" 
    [style.--btn-hover]="hoverColor"
    [style.--btn-border-color]="borderColor"
    [style.--badge-textcolor]="badgeConfig.color"
    [style.--bg-badge]="badgeConfig.background"
    [matBadgeSize]="badgeConfig.size"
    [matBadge]="badgeValue" 
    [matBadgePosition]="badgeConfig.position"
    [matBadgeHidden]="hiddenBadge()"
    [ngClass]="{'disabled-btn': disabled }">
    @if(disabled && withSpinner){
        <mat-spinner diameter="20"></mat-spinner>
    }
    @else{
        @if(iconName) {
            <mat-icon class="btn-icon"
                [style.--icon-size]="iconSize"
                [style.--icon-color]="iconColor"
                aria-hidden="false" 
                aria-label="rounded_button"
                fontIcon="{{iconName}}"
                [ngClass]="{'disabled-icon': disabled }">
            </mat-icon>
        } @else {
            <img class="custom-icon"
                [style.--img-icon-size]="size" 
                [src]="bgImageIcon.replace('url(', '').replace(')', '')" 
                alt="custom icon">
        }
    }
</button>
