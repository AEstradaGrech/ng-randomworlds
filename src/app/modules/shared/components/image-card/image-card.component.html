<article class="mode" data-slideshow [style.--glow] = "glowColor">
    <app-slideshow 
        [images]="images" 
        [withProgress]=withProgress 
        [interval]="imageUpdateInterval">
    </app-slideshow>
    <div class="mode-body">
        <span *ngIf="subtitle && subtitle !== ''" class="label">{{subtitle}}</span>
        <!-- @input for link & @Input for TITLE-->
        <h2 *ngIf="title && title !== ''" class="mode-title"><a class="mode-link" href="#quest">{{title}}</a></h2>
        <p *ngIf="description && description !== ''" class="mode-pitch">{{description}}</p>
        <div class="mode-foot">
        <span *ngIf="footerText && footerText !== ''" class="mode-meta">{{footerText}}</span>
        <span *ngIf="actionText && actionText !== ''" class="mode-cta" aria-hidden="true">{{actionText}} <span class="arrow">→</span></span>
        </div>
    </div>
</article>
