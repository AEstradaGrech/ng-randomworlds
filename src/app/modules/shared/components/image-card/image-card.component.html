<article class="mode" data-slideshow style="--glow: var(--ember)">
    <app-slideshow [images]="images" [withProgress]=withProgress>

    </app-slideshow>
    <!-- <img class="slide is-active" src="assets/images/City_1.png" alt="">
    <img class="slide" src="assets/images/Mobb_1.png" alt="">
    <div class="progress" aria-label="Images"></div> -->
    <div class="mode-body">
        <!-- IF SUBTITLE-->
        <span class="label">Choose your own adventure</span>
        <!-- @input for link & @Input for TITLE-->
        <h2 class="mode-title"><a class="mode-link" href="#quest">Quest Mode</a></h2>
        <!-- IF DESC-->
        <p class="mode-pitch">Start in a tavern, take a quest and pick one of four paths each scene. Finish it or die trying.</p>
        <div class="mode-foot">
        <!-- IF LOW DETAILS-->
        <span class="mode-meta">Guided · 4 choices per scene</span>
        <!-- @Input for BTN TXT-->
        <span class="mode-cta" aria-hidden="true">Begin <span class="arrow">→</span></span>
        </div>
    </div>
</article>
