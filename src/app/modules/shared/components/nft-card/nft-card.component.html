<mat-card class="game-card" appearance="outlined">
    <mat-card-header class="card-header">
        <div mat-card-avatar class="game-card-header-image" [ngStyle]="{'background-image': getCollectionLogo()}"></div>
        <div style="display: flex; flex-direction: column; min-width: 0; flex: 1;">
            <mat-card-title class="game-card-title">{{model.metadata.name}}</mat-card-title>
            <mat-card-subtitle class="game-card-subtitle">{{model.metadata.description}}</mat-card-subtitle>
        </div>
    </mat-card-header>
    <div class="card-body">
        <img mat-card-image class="game-card-image" [src]="model.image" alt="Character NFT image">
    </div>
    <mat-card-actions class="game-card-actions"> <!--A: project btns - B: btnConfig & app-rounded btn-->
        @for(btn of cardButtons; track btn){
            <app-rounded-button 
            [id]="btn.id"
            [iconName]="btn.iconName"
            [iconColor]="btn.iconColor"
            [backgroundColor]="btn.color"
            [hoverColor]="btn.hoverColor"
            [borderColor]="btn.borderColor"
            [withSpinner]="btn.withSpinner"
            [disabled]="disabled"
            (onClickEvent)="onButtonClick($event)">
            </app-rounded-button>
        }
        <ng-content class=".projected-buttons">
            <!--[PROJECT NG_CONTAINER HERE WITH CLASS 'projected-buttons'] -->
        </ng-content>
    </mat-card-actions>
</mat-card>
